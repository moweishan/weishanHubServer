# 复制为 application-local.yml 后填写，该本地文件已被 Git 忽略。
# 从 server/ 启动自动加载；也可以不创建文件，直接使用环境变量。
spring:
  datasource:
    druid:
      master:
        username: "填写数据库用户名"
        password: "填写数据库密码，无密码时使用空字符串"
  redis:
    host: localhost
    port: 6379
    database: 0
    password: ""
token:
  secret: "替换为随机生成的至少32字节密钥"
home:
  weather:
    # 可选：高德开放平台“Web服务”Key，仅后端使用，不写入前端环境变量。
    # 也可以使用环境变量 AMAP_WEB_SERVICE_KEY，效果相同。
    # 不需要天气时保持空字符串；需要时再填写真实 Key。
    amap-key: ""
